[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "crypto-risk-env"
version = "1.0.0"
authors = [
  { name="ARKAISW" },
]
description = "An OpenEnv-compliant environment for evaluating LLM agents on cryptocurrency risk management discipline."
readme = "README.md"
requires-python = ">=3.10"
classifiers = [
    "Programming Language :: Python :: 3",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
]
dependencies = [
    "fastapi",
    "uvicorn",
    "pydantic",
    "openai",
    "numpy",
    "requests",
    "pyyaml",
    "httpx",
    "openenv-core>=0.2.0",
]

[project.scripts]
server = "server.app:app"

[project.urls]
"Homepage" = "https://huggingface.co/spaces/ARKAISW/CryptoRiskEnv"
"Bug Tracker" = "https://github.com/ARKAISW/Crypto-risk-benchmark/issues"
